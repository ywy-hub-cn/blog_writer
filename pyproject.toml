[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blog-writer"
version = "2.1.0"
description = "企业级多Agent人机协同SEO博客与社媒内容自动化系统"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "拓鹰智能", email = "dev@smsboosting.com"},
]
keywords = ["ai", "agent", "seo", "blog", "workflow", "langgraph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # 核心框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    # HTTP与API
    "httpx>=0.27.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.0",
    # 搜索功能（Agent工具链依赖）
    "ddgs>=6.0.0",
    "duckduckgo-search>=7.0.0",
    # 品牌中文名称转拼音
    "pypinyin>=0.50.0",
    # JSON修复（_raw容错提取）
    "json-repair>=0.10.0",
]

[project.optional-dependencies]
# 数据库后端（默认SQLite无需额外包）
postgres = ["psycopg2-binary>=2.9.9"]
mysql = ["pymysql>=1.1.0"]
# 状态外置（Redis Token/Webhook持久化，不装自动回退内存）
redis = ["redis>=5.0.0"]
# 审核会话外置（Redis Pub/Sub，多副本部署必需）
redis-review = ["redis>=5.0.0"]
# 完整安装（含所有可选依赖）
all = [
    "psycopg2-binary>=2.9.9",
    "pymysql>=1.1.0",
    "redis>=5.0.0",
]
# 开发工具
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.10.0",
    "isort>=5.13.0",
    "ruff>=0.7.0",
    "mypy>=1.8.0",
    "interrogate>=1.6.0",
    "bandit>=1.7.8",
    "pre-commit>=3.5.0",
]

[project.scripts]
blog-writer = "blog_writer.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["blog_writer*"]
exclude = ["tests*", "docs*", "tools*", "deploy*", "brands*", "instance*"]

# ============================================
# Ruff - Lint + Format（替代flake8/isort/black）
# ============================================
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "instance/",
    "brands/",
    "docs/",
    "deploy/",
    "tools/",
    "web_templates/",
    ".venv/",
    "__pycache__/",
    "*.pyc",
]

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, W: pycodestyle warnings
# I: isort, B: bugbear, UP: pyupgrade, SIM: simplify
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # line too long（由line-length控制，部分长字符串允许超过）
    "W503",  # line break before binary operator（与W504互斥，选后者）
    "B008",  # function call in default argument（FastAPI依赖注入常用）
    "UP006",  # use `list` instead of `List`（3.9+，但保持兼容写法）
    "UP007",  # use `X | Y` instead of `Union`（3.10+，但保持兼容写法）
]
# 按文件忽略规则
[tool.ruff.lint.per-file-ignores]
"blog_writer/agent/executor.py" = ["B008"]
"blog_writer/workflow_service.py" = ["B008"]
"tests/*" = ["B008", "S101"]  # 测试允许assert

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ============================================
# mypy - 类型检查
# ============================================
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
strict_optional = true
no_implicit_optional = true
exclude = [
    "instance/",
    "brands/",
    "docs/",
    "deploy/",
    "tools/",
    "tests/",
    ".venv/",
]

# ============================================
# interrogate - 文档覆盖率检查（≥80%）
# ============================================
[tool.interrogate]
ignore_init_method = true
ignore_module_docstrings = false
ignore_private = false
ignore_semiprivate = false
fail_under = 80
exclude = [
    "instance/",
    "brands/",
    "docs/",
    "deploy/",
    "tools/",
    "tests/",
    ".venv/",
]

# ============================================
# bandit - 安全检查
# ============================================
[tool.bandit]
exclude_dirs = [
    "instance",
    "brands",
    "docs",
    "deploy",
    "tools",
    "tests",
    ".venv",
]
severity_level = "low"
confidence_level = "low"

# ============================================
# pytest - 测试配置
# ============================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "asyncio: 标记异步测试",
    "slow: 标记慢速测试（默认跳过）",
    "integration: 集成测试（需要外部服务）",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["blog_writer"]
omit = [
    "*/tests/*",
    "*/instance/*",
    "*/__init__.py",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60

[tool.coverage.html]
directory = "htmlcov"

# ============================================
# isort - 导入排序（ruff已内置，保留兼容）
# ============================================
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["blog_writer"]
skip = [".venv", "instance", "brands", "docs", "deploy", "tools", "tests"]

# ============================================
# black - 代码格式化（ruff已内置，保留兼容）
# ============================================
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.venv
  | instance
  | brands
  | docs
  | deploy
  | tools
  | tests
)/
'''
