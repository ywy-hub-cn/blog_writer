[pytest]
# Blog-Writer AI Workflow System - 单元测试配置

# 测试发现
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 测试覆盖率
addopts = 
    -v
    --tb=short
    --strict-markers
    -p no:warnings
    --cov=blog_writer
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=30

# 标记
markers =
    slow: 标记慢测试
    integration: 标记集成测试
    security: 标记安全测试
    workflow: 标记工作流测试

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 异步测试
asyncio_mode = auto

# 最小版本
minversion = 7.0

# 选项
xfail_strict = true
